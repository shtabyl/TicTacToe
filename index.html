<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <input class="player-name" type="text" value="Player One" onclick="this.select()">
    <input class="player-name" type="text" value="Player Two" onclick="this.select()">
    <div class="turn"></div>
    <div class="round"></div>
    <div class="board"></div>
    <button class="start-game">Start new game</button>
    <div class="result"></div>
</body>
</html>
